# Ephemeral fixtures for scripts/functional-test.sh -- not used in
# production, only by .github/workflows/test.yml (and locally, for the
# same purpose).
#
# postgres/mariadb/mongo have natively-compiled client binaries that can
# break from a base-image change (e.g. the mariadb-dump/mysqldump
# package-name mixup this project hit switching to Ubuntu), so their whole
# dump/restore round trip is exercised here. qdrant and tar go through
# curl/jq/tar only, but they're covered too so the publish gate proves
# every restore path the operator scripts offer, not just the db ones.
# surreal is still uncovered (logical export/import over HTTP, no scripted
# restore).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 2s
      retries: 30

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpass
      MARIADB_DATABASE: testdb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongo:
    image: mongo:8.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # No healthcheck: the qdrant image is distroless (no shell/curl), so
  # functional-test.sh polls /healthz with curl from the backup container
  # instead.
  qdrant:
    image: qdrant/qdrant:v1.19.1

  backup:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - test-archive:/archive
    entrypoint: ["sleep", "infinity"]

volumes:
  test-archive:
