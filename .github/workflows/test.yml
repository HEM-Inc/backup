name: Docker Test

on:
  pull_request:
  workflow_call: # invoked by publish.yml, which requires this to pass before pushing to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t backup:test .

  functional:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore-verify postgres/mariadb/mongo
        run: ./scripts/functional-test.sh
