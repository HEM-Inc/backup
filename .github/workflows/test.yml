name: Docker Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # so publish.yml can require this to pass before pushing to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t backup:test .

  functional:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore-verify postgres/mariadb/mongo
        run: ./scripts/functional-test.sh
